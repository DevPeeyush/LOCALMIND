[project]
name = "offline-ai-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DevPeeyush", email = "vermapeeyush123@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docx2txt>=0.9",
    "faiss-cpu>=1.16.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pandas>=3.1.1",
    "pdf2image>=1.17.0",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "pypdf>=7.1.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
offline-ai-assistant = "offline_ai_assistant.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
